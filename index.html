<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/public/images/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO Meta Tags -->
  <title>Lampeter 43 | Your Page Title / Property Name</title>
  <meta name="title" content="Lampeter 43 | Your Page Title / Property Name" />
  <meta name="description"
    content="Add a compelling 150-160 character description of your property, services, or business here so people find you easily on Google." />
  <meta name="keywords" content="lampeter, accommodation, rentals, your keywords here" />

  <!-- Open Graph / Social Media (Facebook, LinkedIn, WhatsApp) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://yourwebsite.com/" />
  <meta property="og:title" content="Lampeter 43 | Your Page Title" />
  <meta property="og:description"
    content="Add a compelling description for when your link is shared on social media." />
  <meta property="og:image" content="https://yourwebsite.com/social-preview.jpg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://yourwebsite.com/" />
  <meta name="twitter:title" content="Lampeter 43 | Your Page Title" />
  <meta name="twitter:description" content="Add a compelling description for Twitter." />
  <meta name="twitter:image" content="https://yourwebsite.com/social-preview.jpg" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
